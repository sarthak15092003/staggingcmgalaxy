name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Basic Check
        run: echo "Repository checked out successfully. Ready for deployment."

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Deploy theme files to hello-elementor theme folder
      - name: Deploy Theme Files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /wp-content/themes/hello-elementor/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/plugins/**
            .ftp-deploy-sync-state.json

      # Deploy CMGalaxy Blog Ratings plugin to wp-content/plugins
      - name: Deploy Blog Ratings Plugin
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./plugins/cmg-blog-ratings/
          server-dir: /wp-content/plugins/cmg-blog-ratings/
          dangerous-clean-slate: false
          exclude: |
            **/.git*

      # Deploy CMGalaxy Lead Form plugin to wp-content/plugins
      - name: Deploy Lead Form Plugin
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./plugins/cmg-lead-form/
          server-dir: /wp-content/plugins/cmg-lead-form/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
